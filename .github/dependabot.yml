version: 2

updates:
  # pnpm uses the npm ecosystem; Dependabot reads pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Majors are left out so each breaking change gets its own PR.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vsce refuses to package when @types/vscode is newer than engines.vscode
      # (^1.80.0). Bump both together by hand when raising the minimum VS Code.
      - dependency-name: "@types/vscode"
      # TypeScript 7 (the native Go compiler) drops the JS compiler API that
      # typescript-eslint loads, so `pnpm run lint` crashes. TypeScript is pinned
      # to 5.5.4, the last release inside typescript-eslint 7.18's supported
      # range (<5.6.0). Bump it by hand together with typescript-eslint.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
