<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src {{CSP_SOURCE}}; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}';" />
  <title>Claude Usage</title>
  <style nonce="{{NONCE}}">
    body.vscode-dark, body.vscode-high-contrast {
      --bg: #1a1a1a;
      --surface: #2a2a2a;
      --surface-hover: #333333;
      --border: #3d3d3d;
      --text: #e8e0d8;
      --text-dim: #9a918b;
      --accent: #d97757;
      --accent-dim: rgba(217, 119, 87, 0.15);
      --header-bg: #151515;
      --bar-bg: #3c3c3c;
      --bar-ok: #4caf50;
      --bar-warn: #dfb317;
      --bar-crit: #e05d44;
      /* Weekly breakdown chart — categorical slots, validated as a set against --surface */
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-other: #898781;
    }

    body.vscode-light, body.vscode-high-contrast-light {
      --bg: #faf5f0;
      --surface: #f0e9e1;
      --surface-hover: #e8dfd6;
      --border: #d9cfc5;
      --text: #3d3029;
      --text-dim: #7a6e64;
      --accent: #d97757;
      --accent-dim: rgba(217, 119, 87, 0.12);
      --header-bg: #f5ede5;
      --bar-bg: #d9cfc5;
      --bar-ok: #388e3c;
      --bar-warn: #b8960a;
      --bar-crit: #c62828;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-5: #e87ba4;
      --series-other: #898781;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 32px;
      line-height: 1.6;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border);
    }

    .btn:disabled:hover {
      background: var(--surface);
      border-color: var(--border);
    }

    .error-banner {
      background: rgba(224, 93, 68, 0.1);
      border: 1px solid rgba(224, 93, 68, 0.35);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #e05d44;
      margin-bottom: 20px;
    }

    .progress-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dim);
    }

    .progress-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .progress-value .max {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dim);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--bar-bg);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .progress-bar-fill.ok   { background: var(--bar-ok); }
    .progress-bar-fill.warn { background: var(--bar-warn); }
    .progress-bar-fill.crit { background: var(--bar-crit); }

    .progress-hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .breakdown-card {
      margin-bottom: 24px;
    }

    .breakdown-body {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 28px;
      padding-top: 4px;
    }

    .donut {
      flex-shrink: 0;
      overflow: visible;
    }

    .donut circle {
      fill: none;
      stroke-width: 18;
    }

    .donut .seg {
      stroke: var(--series);
      cursor: default;
      transition: opacity 0.15s;
    }

    .donut-value {
      fill: var(--text);
      font-size: 24px;
      font-weight: 700;
    }

    .donut-label {
      fill: var(--text-dim);
      font-size: 11px;
    }

    .breakdown-legend {
      list-style: none;
      flex: 1;
      min-width: 180px;
      max-width: 320px;
      font-size: 13px;
    }

    .breakdown-legend li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px;
      margin: 0 -8px;
      border-radius: 6px;
      transition: opacity 0.15s, background 0.15s;
    }

    .breakdown-legend li.active { background: var(--surface-hover); }

    .breakdown-legend .swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--series);
      flex-shrink: 0;
    }

    .breakdown-legend .name { flex: 1; }

    .breakdown-legend .pct {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .breakdown-card.hovering .seg:not(.active),
    .breakdown-card.hovering li:not(.active) {
      opacity: 0.35;
    }

    /* Colour follows the product (its key), never its rank or position */
    .series-1 { --series: var(--series-1); }
    .series-2 { --series: var(--series-2); }
    .series-3 { --series: var(--series-3); }
    .series-4 { --series: var(--series-4); }
    .series-5 { --series: var(--series-5); }
    .series-other { --series: var(--series-other); }

    .info-row {
      background: var(--header-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 13px;
      margin-bottom: 20px;
      align-items: center;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
    }

    .info-item strong {
      color: var(--text);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.none        { background: var(--bar-ok); }
    .status-dot.minor       { background: var(--bar-warn); }
    .status-dot.major,
    .status-dot.critical    { background: var(--bar-crit); }
    .status-dot.maintenance { background: var(--accent); }
    .status-dot.unknown     { background: var(--text-dim); }

    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer .credit {
      margin-top: 4px;
    }

    .no-data {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
      font-style: italic;
    }

    .refresh-bar {
      height: 2px;
      background: var(--accent);
      width: 0%;
      margin-bottom: 24px;
      border-radius: 1px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .refresh-bar.active {
      opacity: 1;
      animation: refresh-fill 60s linear forwards;
    }

    @keyframes refresh-fill {
      from { width: 0%; }
      to   { width: 100%; }
    }

    .btn-icon {
      vertical-align: middle;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <img src="{{CLAWD_ICON}}" width="24" height="24" alt="" />
      </div>
      <h1>Claude Usage</h1>
    </div>
    <div class="header-right">
      <span class="badge" id="plan-badge">&#8212;</span>
      <button class="btn" id="btn-refresh" title="Refresh usage data">&#8635; Refresh</button>
      <button class="btn" id="btn-skills" title="View installed skills"><img src="{{TOOLS_ICON}}" width="14" height="14" alt="" class="btn-icon">Skills</button>
      <button class="btn" id="btn-mcp" title="View MCP servers"><img src="{{SERVER_ICON}}" width="14" height="14" alt="" class="btn-icon">MCP</button>
    </div>
  </div>

  <div id="refresh-bar" class="refresh-bar"></div>
  <div id="error-banner" class="error-banner" style="display:none"></div>
  <div id="progress-section" class="progress-section"></div>

  <div id="breakdown-card" class="progress-card breakdown-card" hidden>
    <div class="progress-header">
      <span class="progress-label">Weekly usage by product</span>
      <span class="progress-hint" id="breakdown-since"></span>
    </div>
    <div class="breakdown-body">
      <svg id="breakdown-donut" class="donut" width="140" height="140" viewBox="0 0 140 140" role="img"></svg>
      <ul id="breakdown-legend" class="breakdown-legend"></ul>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-label">MCP In Config</span>
        <span class="progress-value">{{MCP_TOTAL}}<span class="max"> / 30</span></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="mcp-config-bar"></div>
      </div>
      <div class="progress-hint">Target: 20 &ndash; 30 servers</div>
    </div>
    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-label">MCP Enabled</span>
        <span class="progress-value">{{MCP_ENABLED}}<span class="max"> / 10</span></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="mcp-enabled-bar"></div>
      </div>
      <div class="progress-hint">Keep under 10 enabled</div>
    </div>
  </div>

  <div id="info-row" class="info-row"></div>

  <div class="footer">
    <a href="#" id="manage-link">Manage usage on claude.ai &#8599;</a>
    <div class="credit">Made by Jos&eacute; Costa &middot; <a href="#" id="author-link">github.com/zepedrocosta &#8599;</a></div>
  </div>

  <script id="initial-data" type="application/json">{{INITIAL_DATA}}</script>
  <script nonce="{{NONCE}}">
    const vscodeApi = acquireVsCodeApi();

    const refreshBar = document.getElementById('refresh-bar');
    const btnRefresh = document.getElementById('btn-refresh');
    let refreshEnableTimer = null;

    function startRefreshBar() {
      refreshBar.classList.remove('active');
      void refreshBar.offsetWidth; // force reflow to restart animation
      refreshBar.classList.add('active');
      btnRefresh.disabled = true;
      clearTimeout(refreshEnableTimer);
      refreshEnableTimer = setTimeout(() => {
        btnRefresh.disabled = false;
        refreshBar.classList.remove('active');
      }, 60000);
    }

    function stopRefreshBar() {
      refreshBar.classList.remove('active');
      // button stays disabled until the 60s timer fires
    }

    btnRefresh.addEventListener('click', () => {
      startRefreshBar();
      vscodeApi.postMessage({ command: 'refresh' });
    });
    document.getElementById('btn-skills').addEventListener('click', () => {
      vscodeApi.postMessage({ command: 'showSkills' });
    });
    document.getElementById('btn-mcp').addEventListener('click', () => {
      vscodeApi.postMessage({ command: 'showMcp' });
    });
    document.getElementById('manage-link').addEventListener('click', (e) => {
      e.preventDefault();
      vscodeApi.postMessage({ command: 'openConsole' });
    });
    document.getElementById('author-link').addEventListener('click', (e) => {
      e.preventDefault();
      vscodeApi.postMessage({ command: 'openAuthor' });
    });

    function barClass(pct) {
      if (pct >= 90) return 'crit';
      if (pct >= 75) return 'warn';
      return 'ok';
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    // ─── Weekly breakdown donut ────────────────────────────────────────────
    const DONUT_C = 70;                          // centre; viewBox units are px
    const DONUT_R = 54;                          // ring mid-radius (stroke 18 → 45..63)
    const DONUT_LEN = 2 * Math.PI * DONUT_R;
    const DONUT_GAP = 2;                         // surface gap between slices
    const BREAKDOWN_SLOTS = { claude_code: '1', chat: '2', cowork: '3' };
    let breakdownRows = [];

    // Known products keep a fixed colour; unknown keys take the spare slots in
    // API order (not rank, so a colour survives re-sorting), and anything past
    // those folds into the "Other" grey.
    function breakdownSlots(rows) {
      let next = 4;
      return rows.map(r => {
        if (BREAKDOWN_SLOTS[r.key]) return BREAKDOWN_SLOTS[r.key];
        if (r.key !== 'other' && next <= 5) return String(next++);
        return 'other';
      });
    }

    function setDonutCentre(row) {
      document.getElementById('donut-value').textContent = row.percentage + '%';
      document.getElementById('donut-label').textContent = row.label;
    }

    function renderBreakdown(breakdown) {
      const card = document.getElementById('breakdown-card');
      const apiRows = (breakdown && breakdown.rows) || [];
      const slots = breakdownSlots(apiRows);
      // Largest share first; products with no usage are left out entirely.
      breakdownRows = apiRows
        .map((r, i) => ({ ...r, slot: slots[i] }))
        .filter(r => r.percentage > 0)
        .sort((a, b) => b.percentage - a.percentage);
      card.hidden = breakdownRows.length === 0;
      if (card.hidden) return;

      const rows = breakdownRows;
      const total = rows.reduce((sum, r) => sum + r.percentage, 0);

      const since = breakdown.since ? new Date(breakdown.since) : null;
      document.getElementById('breakdown-since').textContent =
        since && !isNaN(since.getTime())
          ? 'Since ' + since.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })
          : '';

      // Each slice is a dashed ring, clockwise from 12 o'clock in legend order.
      let offset = 0;
      const slices = rows.map((r, i) => {
        const len = (r.percentage / total) * DONUT_LEN;
        const dash = rows.length > 1 ? Math.max(len - DONUT_GAP, 0.5) : len;
        const slice = `<circle class="seg series-${r.slot}" data-i="${i}"
          cx="${DONUT_C}" cy="${DONUT_C}" r="${DONUT_R}"
          stroke-dasharray="${dash} ${DONUT_LEN}" stroke-dashoffset="${-offset}"
          transform="rotate(-90 ${DONUT_C} ${DONUT_C})"><title>${esc(r.label)}: ${r.percentage}%</title></circle>`;
        offset += len;
        return slice;
      }).join('');

      const donut = document.getElementById('breakdown-donut');
      donut.setAttribute('aria-label',
        'Weekly usage by product: ' + rows.map(r => `${r.label} ${r.percentage}%`).join(', '));
      donut.innerHTML = `
        ${slices}
        <text id="donut-value" class="donut-value" x="${DONUT_C}" y="${DONUT_C}" text-anchor="middle"></text>
        <text id="donut-label" class="donut-label" x="${DONUT_C}" y="${DONUT_C + 18}" text-anchor="middle"></text>`;

      document.getElementById('breakdown-legend').innerHTML = rows.map((r, i) => `
        <li class="series-${r.slot}" data-i="${i}">
          <span class="swatch"></span>
          <span class="name">${esc(r.label)}</span>
          <span class="pct">${r.percentage}%</span>
        </li>`).join('');

      setDonutCentre(rows[0]);
    }

    // Hovering a slice or a legend row highlights the pair and shows it in the centre.
    function highlightBreakdown(i) {
      const card = document.getElementById('breakdown-card');
      card.classList.toggle('hovering', i !== null);
      card.querySelectorAll('[data-i]').forEach(el => {
        el.classList.toggle('active', el.dataset.i === String(i));
      });
      setDonutCentre(breakdownRows[i === null ? 0 : i]);
    }

    const breakdownCard = document.getElementById('breakdown-card');
    breakdownCard.addEventListener('mouseover', e => {
      const target = e.target.closest('[data-i]');
      highlightBreakdown(target ? Number(target.dataset.i) : null);
    });
    breakdownCard.addEventListener('mouseleave', () => highlightBreakdown(null));

    function renderData(data) {
      document.getElementById('plan-badge').textContent = data.plan || '\u2014';

      const banner = document.getElementById('error-banner');
      if (data.error) {
        banner.textContent = '\u26A0 ' + data.error;
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }

      const limits = [data.sessionLimit, data.weeklyLimit, data.extraUsage].filter(Boolean);
      const section = document.getElementById('progress-section');

      if (limits.length === 0) {
        section.innerHTML = '<div class="no-data">No usage data available.</div>';
      } else {
        section.innerHTML = limits.map(l => `
          <div class="progress-card">
            <div class="progress-header">
              <span class="progress-label">${l.label}</span>
              <span class="progress-value">${l.percentage}<span class="max">%</span></span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill ${barClass(l.percentage)}" data-pct="${l.percentage}"></div>
            </div>
            ${l.subLabel ? `<div class="progress-hint">${l.subLabel}</div>` : ''}
          </div>
        `).join('');
        section.querySelectorAll('.progress-bar-fill').forEach(el => {
          el.style.width = el.dataset.pct + '%';
        });
      }

      renderBreakdown(data.weeklyBreakdown);

      const infoItems = [];

      if (data.serviceStatus) {
        const ind = data.serviceStatus.indicator;
        infoItems.push(`
          <span class="info-item">
            <span class="status-dot ${ind}"></span>
            <strong>${data.serviceStatus.description}</strong>
          </span>`);
      }

      if (data.modelInfo) {
        const effort = data.modelInfo.effortLevel;
        const label = effort.charAt(0).toUpperCase() + effort.slice(1);
        infoItems.push(`<span class="info-item">Effort: <strong>${label}</strong></span>`);
      }

      infoItems.push(`<span class="info-item">Updated: <strong>${data.lastUpdated}</strong></span>`);

      document.getElementById('info-row').innerHTML = infoItems.join('');
    }

    const mcpConfigBar = document.getElementById('mcp-config-bar');
    mcpConfigBar.style.width = '{{MCP_CONFIG_PCT}}%';
    mcpConfigBar.style.background = '{{MCP_CONFIG_COLOR}}';
    const mcpEnabledBar = document.getElementById('mcp-enabled-bar');
    mcpEnabledBar.style.width = '{{MCP_ENABLED_PCT}}%';
    mcpEnabledBar.style.background = '{{MCP_ENABLED_COLOR}}';

    renderData(JSON.parse(document.getElementById('initial-data').textContent));

    window.addEventListener('message', event => {
      if (event.data.command === 'update') {
        stopRefreshBar();
        renderData(event.data.data);
      } else if (event.data.command === 'refreshStarted') {
        startRefreshBar();
      }
    });
  </script>
</body>
</html>
